<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">How a landing page is assembled</title>
  <desc id="desc">A brand spec and a campaign spec go through the shared creator, which writes static files you host. The ad click lands on that page. Secrets stay in your env file.</desc>
  <rect width="960" height="280" fill="#f7f6f3"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1c1917">
    <rect x="24" y="36" width="200" height="200" rx="12" fill="#fff" stroke="#d6d3d1"/>
    <text x="40" y="64" font-weight="700">Your spec</text>
    <text x="40" y="96" fill="#44403c">brand.json</text>
    <text x="40" y="120" fill="#44403c">campaign.json</text>
    <text x="40" y="144" fill="#44403c">assets/logo + hero</text>
    <text x="40" y="180" fill="#78716c" font-size="12">Not committed.</text>
    <text x="40" y="198" fill="#78716c" font-size="12">One folder per company.</text>

    <rect x="280" y="36" width="220" height="200" rx="12" fill="#10210a"/>
    <text x="296" y="64" font-weight="700" fill="#e7f8c8">Landing Page Creator</text>
    <text x="296" y="100" fill="#d9f99d">preflight + contrast</text>
    <text x="296" y="124" fill="#d9f99d">Chrome clicks the CTA</text>
    <text x="296" y="148" fill="#d9f99d">escapes the copy</text>
    <text x="296" y="184" fill="#a3e635" font-size="12">Shared. Same for everyone.</text>

    <rect x="556" y="36" width="180" height="200" rx="12" fill="#fff" stroke="#d6d3d1"/>
    <text x="572" y="64" font-weight="700">dist/</text>
    <text x="572" y="100" fill="#44403c">index.html</text>
    <text x="572" y="124" fill="#44403c">styles.css</text>
    <text x="572" y="148" fill="#44403c">client.js</text>
    <text x="572" y="184" fill="#78716c" font-size="12">Deploy this folder only.</text>

    <rect x="792" y="36" width="144" height="88" rx="12" fill="#fff" stroke="#d6d3d1"/>
    <text x="808" y="68" font-weight="700">Ad click</text>
    <text x="808" y="96" fill="#44403c">UTMs + click id</text>

    <rect x="792" y="148" width="144" height="88" rx="12" fill="#fff" stroke="#d6d3d1"/>
    <text x="808" y="180" font-weight="700">Your host</text>
    <text x="808" y="208" fill="#44403c">HTTPS page</text>

    <path d="M224 136 H280" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
    <path d="M500 136 H556" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
    <path d="M736 180 H792" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
    <path d="M864 124 V148" stroke="#1c1917" stroke-width="2" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#1c1917"/>
    </marker>
  </defs>
</svg>
